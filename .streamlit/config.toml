# Streamlit look and behaviour for VerdictAi.
# The colours come from the logo: its dark violet background (#0D0121) and
# the violet of the "V" and of "Ai" (#704BED).
[theme]
base = "dark"
primaryColor = "#7C5CFF"
backgroundColor = "#0D0121"
secondaryBackgroundColor = "#1A0F3D"
textColor = "#ECE8FF"
font = "sans serif"

[client]
# Hide Streamlit's developer menu items; this is an app, not a dev tool.
toolbarMode = "minimal"
